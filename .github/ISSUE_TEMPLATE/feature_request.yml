name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Fit with AI-GTM
      options:
        - label: Any action that leaves the system goes through an explicit approval gate
          required: true
